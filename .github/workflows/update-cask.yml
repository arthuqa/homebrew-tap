name: update-cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Reads the public datasetop releases anonymously: the workflow token is
      # scoped to this repository and cannot see another one.
      - name: Resolve the latest datasetop release
        id: release
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/arthuqa/datasetop/releases/latest"
          if ! json=$(curl -fsSL "$api" 2>/dev/null); then
            echo "No published datasetop release yet; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(printf '%s' "$json" | jq -r '.tag_name')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "The latest release has no tag; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Download the macOS disk images
        if: steps.release.outputs.skip == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          base="https://github.com/arthuqa/datasetop/releases/download/${TAG}"
          for arch in aarch64 x64; do
            name="datasetop_${VERSION}_${arch}.dmg"
            curl -fsSL --retry 3 -o "assets/${name}" "${base}/${name}"
          done
          ls -l assets

      - name: Regenerate Casks/datasetop.rb
        if: steps.release.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, sys

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          assets = sorted(pathlib.Path("assets").iterdir())

          def digest(name):
              return next((a for a in assets if a.name.endswith(name)), None)

          arm = digest("_aarch64.dmg")
          intel = digest("_x64.dmg")
          if not arm or not intel:
              sys.exit("The release is missing one of the two macOS disk images")
          expected = {f"datasetop_{version}_aarch64.dmg", f"datasetop_{version}_x64.dmg"}
          if {arm.name, intel.name} != expected:
              sys.exit(f"Unexpected macOS asset names: {arm.name}, {intel.name}")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          lines = [
              'cask "datasetop" do',
              '  arch arm: "aarch64", intel: "x64"',
              "",
              f'  version "{version}"',
              f'  sha256 arm: "{sha256(arm)}",',
              f'         intel: "{sha256(intel)}"',
              "",
              '  url "https://github.com/arthuqa/datasetop/releases/download/v#{version}/datasetop_#{version}_#{arch}.dmg"',
              '  name "datasetop"',
              '  desc "Chat-first MCP agent for a local folder"',
              '  homepage "https://github.com/arthuqa/datasetop"',
              "",
              "  livecheck do",
              '    url "https://github.com/arthuqa/datasetop"',
              "    strategy :github_latest",
              "  end",
              "",
              '  depends_on macos: :big_sur',
              "",
              '  app "datasetop.app"',
              "",
              "  caveats <<~EOS",
              "    The macOS build is not notarized. If macOS blocks the first launch, run:",
              "",
              "      xattr -dr com.apple.quarantine /Applications/datasetop.app",
              "",
              "    or allow it from System Settings -> Privacy & Security -> Open Anyway.",
              "  EOS",
              "",
              "  zap trash: [",
              '    "~/Library/Application Support/app.datasetop.desktop",',
              '    "~/Library/Caches/app.datasetop.desktop",',
              '    "~/Library/Saved Application State/app.datasetop.desktop.savedState",',
              "  ]",
              "end",
              "",
          ]

          out = pathlib.Path("Casks/datasetop.rb")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines))
          print(out.read_text())
          PY

      - name: Commit and push
        if: steps.release.outputs.skip == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/datasetop.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git commit -m "datasetop ${TAG}"
          git push
